<!-- mutis icons (11-brand §13.8, spec §12.1): 24-px grid, 1.5-px stroke, square caps, mitre joins,
     built from a square, a circle and a slot. Use: <svg class="icon"><use href="/shared/icons.svg#arrow"/></svg> -->
<svg xmlns="http://www.w3.org/2000/svg">
  <symbol id="lock" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" d="M4 4H20V20H4Z"/>
    <path fill="currentColor" fill-rule="evenodd" d="M9.5 10A2.5 2.5 0 1 0 14.5 10A2.5 2.5 0 1 0 9.5 10ZM11.25 13.5H12.75L14 17H10Z"/>
  </symbol>
  <symbol id="link" viewBox="0 0 24 24">
