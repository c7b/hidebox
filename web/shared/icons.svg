  </symbol>
  <symbol id="warning" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" d="M4 4H20V20H4ZM12 8V13M12 16V16.5"/>
  </symbol>
  <symbol id="report" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" d="M6 21V4H17L14.5 8.5L17 13H6"/>
  </symbol>
  <symbol id="save" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" d="M12 4V15M7 10L12 15L17 10M4 15V20H20V15"/>
