  </symbol>
  <symbol id="report" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" d="M6 21V4H17L14.5 8.5L17 13H6"/>
  </symbol>
  <symbol id="save" viewBox="0 0 24 24">
