  </symbol>
  <symbol id="external" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" d="M10 5H5V19H19V14M13 5H19V11M19 5L11 13"/>
