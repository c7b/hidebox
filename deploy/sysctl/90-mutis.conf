# Kernel settings for the server, installed as /etc/sysctl.d/90-mutis.conf by deploy/scripts/provision.sh
# (which saves the values they replace under /var/backups/mutis first). They narrow what a process that
# somehow ran code as one of the service users could do to the kernel or to other processes; none of them
# changes what the service does. docs/review/upload-safety-1.md, section 5, says why each one is here.

# Kernel addresses hidden from everyone, the kernel log from all but root.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# No BPF for unprivileged users until the next boot; the BPF JIT hardened against spraying.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# A process may trace only its own children (root still can).
kernel.yama.ptrace_scope = 1
# No loading of another kernel into the running one, until the next boot.
kernel.kexec_load_disabled = 1
# An unprivileged user can't make the kernel load a terminal line-discipline module.
dev.tty.ldisc_autoload = 0
# io_uring off for everyone: a large kernel interface with a record of privilege escalations, and nothing
# here uses it (Python, Caddy, walletd; Node's libuv falls back to its thread pool).
kernel.io_uring_disabled = 2
# Debian's defaults (fifos raised from 1), written down so that a package can't relax them unnoticed.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0
kernel.randomize_va_space = 2
kernel.perf_event_paranoid = 3
vm.unprivileged_userfaultfd = 0

# One interface, one route: strict reverse-path filtering, SYN cookies, no ICMP redirects either way,
# no source routing. log_martians stays off: it would write source addresses to the journal.
# The kernel uses the larger of `all` and the interface's own value, and systemd's 50-default.conf sets
# every interface to 2 (loose), so the glob (systemd-sysctl applies it, at boot and in provision.sh).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.*.rp_filter = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
