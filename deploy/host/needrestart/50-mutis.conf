# /etc/needrestart/conf.d/50-mutis.conf (provision.sh). After unattended security upgrades, restart the services that
# still use old libraries at once, except the wallet daemons and the chain workers (and an instance's L1 wallet and
# launch trigger): those wait for a planned restart or reboot, so an upgrade never interrupts a payment in flight.
$nrconf{restart} = "a";
$nrconf{override_rc}->{qr(^walletd\.service$)} = 0;
$nrconf{override_rc}->{qr(^mutis-.*walletd.*\.service$)} = 0;
$nrconf{override_rc}->{qr(^mutis-.*l1wallet.*\.service$)} = 0;
$nrconf{override_rc}->{qr(^mutis-.*chain\.service$)} = 0;
$nrconf{override_rc}->{qr(^mutis-.*launch.*\.service$)} = 0;
