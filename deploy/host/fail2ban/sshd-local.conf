# /etc/fail2ban/jail.d/sshd-local.conf (provision.sh, when fail2ban is installed). On Debian 13 (OpenSSH 10) failed
# logins are logged by sshd-session, so the default journalmatch (_COMM=sshd) saw none of them: match the unit instead.
# An address that must never be banned (the operator's) goes in /etc/fail2ban/jail.d/sshd-local.local on the server
# only (`[sshd]` and `ignoreip = 127.0.0.1/8 ::1 <address>`), never in this repository.
[sshd]
enabled = true
backend = systemd
journalmatch = _SYSTEMD_UNIT=ssh.service
mode = normal
maxretry = 4
findtime = 10m
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
ignoreself = true
ignoreip = 127.0.0.1/8 ::1
