# SPDX-License-Identifier: MIT
# Drop-in for Debian's caddy.service (installed as /etc/systemd/system/caddy.service.d/mutis.conf).
# MUTIS_HOST for the Caddyfile; a private directory for the admin socket; no --environ, which would
# print the whole environment to the journal at every start.
[Service]
EnvironmentFile=/etc/mutis/caddy.env
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
