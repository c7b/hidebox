# SPDX-License-Identifier: MIT
# Drop-in for Debian's caddy.service (installed as /etc/systemd/system/caddy.service.d/mutis.conf).
# MUTIS_HOST for the Caddyfile; a private directory for the admin socket; no --environ, which would
# print the whole environment to the journal at every start.
[Service]
EnvironmentFile=/etc/mutis/caddy.env
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile

# Caddy parses every request that reaches the server, so it gets mutis-api's sandbox with the one
# capability it needs (binding ports 80 and 443). Debian's unit sets ProtectSystem=full and PrivateTmp.
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
ProtectSystem=strict
# Certificates, the ACME account and the autosaved config live in Caddy's home; the admin socket is the
# RuntimeDirectory above. Everything else is read-only, the site and the status files included.
ReadWritePaths=/var/lib/caddy
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
# ProcSubset=pid is left out: Go sizes its listen backlog from /proc/sys/net/core/somaxconn.
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
# Programs run only from /usr; nothing Caddy can write is executable in its view.
NoExecPaths=/
ExecPaths=/usr
RemoveIPC=yes
UMask=0027
