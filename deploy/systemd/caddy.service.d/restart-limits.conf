# Drop-in for caddy.service (installed as /etc/systemd/system/caddy.service.d/restart-limits.conf by provision.sh).
# Come back at once if Caddy dies (a crash in Go's HTTP/2 server, CVE-2026-97032, was the reason on Debian's 2.6.2),
# and cap its memory so a flood of buffered request bodies (request_buffers) can't push the wallets out of RAM.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=20

[Service]
Restart=always
RestartSec=1
MemoryHigh=768M
MemoryMax=1G
