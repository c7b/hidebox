# SPDX-License-Identifier: MIT
# SealLog for the Ootle mainnet: the 2.0.0 source (../seal_log/src/lib.rs and its tests), built against
# tari_template_lib 0.38, whose template definitions are V2 (Ootle 0.50). The 0.37 build in ../seal_log
# stays the Esmeralda artifact (../dist/); this one is ../dist-v2/. The Ootle crates come from crates.io at
# the exact versions tari-ootle's tag v0.50.0 (commit d3252ef1) published on 2026-11-06; each crate's
# .cargo_vcs_info.json names that commit, and check.sh writes it into ../dist-v2/BUILD-INFO.txt. build.rs is a
# copy of ../seal_log/build.rs, here because `tari lint` reads the crate's own.
[package]
name = "seal_log"
version = "2.1.0"
edition = "2024"
license = "MIT"
description = "Tamper-evident storage receipts: an append-only log of Merkle roots over ciphertext hashes that only its creating key can extend and nobody can rewrite, plus a public notarize call. It stores only hashes and counts."
repository = "https://github.com/c7b/hidebox"
publish = false

[package.metadata.tari-template]
tags = ["transparency-log", "merkle", "receipts"]
category = "utility"
homepage = "https://github.com/c7b/hidebox"
documentation = "https://github.com/c7b/hidebox/blob/main/template/seal_log/README.md"

[lib]
path = "../seal_log/src/lib.rs"
crate-type = ["cdylib"]

[[test]]
name = "seal_log"
path = "../seal_log/tests/seal_log.rs"

[dependencies]
tari_template_lib = "=0.38.0"

[dev-dependencies]
tari_template_test_tooling = "=0.50.0"
# Already in the tree through the test tooling; the tests read and write the JSON vectors with it.
serde_json = "=1.0.152"

[build-dependencies]
tari_ootle_template_build = "=0.18.0"

# The flags `tari build` passes, so `cargo build --release` and the test harness
# produce the same WASM bytes as `tari build`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The engine runs WASM through wasmer + cranelift; unoptimised, the tests crawl.
[profile.dev.package.wasmer]
opt-level = 2

[profile.dev.package.wasmer-compiler]
opt-level = 2

[profile.dev.package.wasmer-compiler-cranelift]
opt-level = 2

[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.cranelift-frontend]
opt-level = 2

[profile.dev.package.cranelift-entity]
opt-level = 2
